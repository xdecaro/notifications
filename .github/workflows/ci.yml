name: Notifications CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        php: ['7.4', '8.3']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: simplexml
          coverage: none

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build/build.sh ]]; then
            bash build/build.sh
          else
            while IFS= read -r -d '' php_file; do
              php -l "$php_file" >/dev/null
            done < <(find component -type f -name '*.php' -print0)
            php -r 'if (simplexml_load_file("component/xdecaronotifications.xml") === false) { exit(1); }'
          fi

      - name: Verify deterministic build
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build/build.sh ]]; then
            cp dist/SHA256SUMS.txt /tmp/SHA256SUMS.first
            bash build/build.sh
            diff -u /tmp/SHA256SUMS.first dist/SHA256SUMS.txt
          fi
