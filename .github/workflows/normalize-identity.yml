name: Normalize Notifications Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-identity.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize technical identity
        run: python3 tools/normalize_identity.py
      - name: Validate PHP and XML
        run: |
          set -euo pipefail
          find component -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').rglob('*.xml'):
              if '.git' not in path.parts:
                  ET.parse(path)
          PY
      - name: Verify clean identity
        run: |
          set -euo pipefail
          test -f component/xdecaronotifications.xml
          grep -Fq 'Xdecaro\Component\Notifications' component/xdecaronotifications.xml
          if grep -RInE 'decaronotifications|DECARONOTIFICATIONS|Decaronotifications' --exclude='normalize_identity.py' component AGENTS.md README.md; then
            echo 'Legacy Notifications identity remains.' >&2
            exit 1
          fi
      - name: Commit normalized baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize Notifications to xdecaro identity'
          git push origin HEAD:main
